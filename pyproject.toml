[project]
name = "jia-ke-chong-bot"
version = "0.1.0"
description = "甲壳虫：QQ 群运动搭子机器人——Garmin/COROS 接入 + 截图 OCR 打卡 + 排行播报 + 科学训练分析（负荷/强度分布/心率区间/VO₂max）"
requires-python = ">=3.10"
dependencies = [
    "nonebot2>=2.3.0",
    "nonebot-adapter-onebot>=2.4.0",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "websockets>=12.0",
    # >=2.1：2.0.39 及更早的 2.0.x 在 Python 3.13 上会让 `Mapped[date]` 抛
    # TypeError: Boolean value of this clause is not defined（import app.models 即崩）
    "sqlalchemy>=2.1",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "httpx>=0.27",
    "garminconnect>=0.2.24",
    "cryptography>=42.0",
    "pillow>=10.0",
    "rapidocr-onnxruntime>=1.2.0",
]

[project.optional-dependencies]
dev = ["ruff>=0.4", "pytest>=8.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
