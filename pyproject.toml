[project]
name = "jia-ke-chong-bot"
version = "0.1.0"
description = "QQ 群运动数据机器人（Garmin / 高驰 COROS + 截图 OCR）"
requires-python = ">=3.10"
dependencies = [
    "nonebot2>=2.3.0",
    "nonebot-adapter-onebot>=2.4.0",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "websockets>=12.0",
    "sqlalchemy>=2.0",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "httpx>=0.27",
    "garminconnect>=0.2.24",
    "cryptography>=42.0",
    "pillow>=10.0",
    "rapidocr-onnxruntime>=1.2.0",
]

[project.optional-dependencies]
dev = ["ruff>=0.4"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]
